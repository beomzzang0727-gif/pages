<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>내 페이지 목록</title>
<style>
:root{--bg:#eef1f3;--card:#fff;--ink:#14181b;--mute:#5b666e;--line:#d5dbdf;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#101417;--card:#182026;--ink:#e7ecef;--mute:#9aa7b0;--line:#2b353c;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 16px}
h1{font-size:22px;margin:0 0 16px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink);text-decoration:none}
a span{display:block;color:var(--mute);font-size:13px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>내 페이지 목록</h1>
<ul>
<li><a href="routine/">축분할 리셋 루틴<span>방학 14일 → 학기 주 4회 · 전방경사 교정 · 편의점 식단 조합기</span></a></li>
</ul>
</main>
</body>
</html>
