<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>축분할 리셋 루틴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: 한 줄 폭의 훈련 카드 묶음. 위에는 탭, 아래로 그날의 종목 카드가 쌓인다.
   색 = 역도 원판 규격색(25kg 빨강 · 20kg 파랑 · 15kg 노랑 · 10kg 초록)을 날짜 종류에 붙였다. */
:root{
  --bg:#eef1f3; --card:#ffffff; --ink:#14181b; --mute:#5b666e; --line:#d5dbdf; --soft:#e4e9ec;
  --red:#c8263a; --blue:#1d5bb8; --yellow:#b88a00; --green:#23825a; --grey:#6b7780;
  --redbg:#fbe9eb; --bluebg:#e7eefb; --yellowbg:#fbf3d9; --greenbg:#e3f3ea; --greybg:#eceff1;
  --focus:#1d5bb8;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101417; --card:#182026; --ink:#e7ecef; --mute:#9aa7b0; --line:#2b353c; --soft:#212a31;
  --red:#ff6b7a; --blue:#6ea2ff; --yellow:#f2c94c; --green:#5fd39b; --grey:#9aa7b0;
  --redbg:#3a1d22; --bluebg:#1a2740; --yellowbg:#3a3015; --greenbg:#16332a; --greybg:#222b31;
  --focus:#6ea2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101417; --card:#182026; --ink:#e7ecef; --mute:#9aa7b0; --line:#2b353c; --soft:#212a31;
  --red:#ff6b7a; --blue:#6ea2ff; --yellow:#f2c94c; --green:#5fd39b; --grey:#9aa7b0;
  --redbg:#3a1d22; --bluebg:#1a2740; --yellowbg:#3a3015; --greenbg:#16332a; --greybg:#222b31;
  --focus:#6ea2ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:14px}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;letter-spacing:.5px;text-wrap:balance}
.brand small{color:var(--mute);font-size:12px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:28px 0 8px;text-wrap:balance}
h3{font-size:16px;margin:20px 0 6px}
p{margin:6px 0}
.mute{color:var(--mute)}
.lead{color:var(--mute);font-size:14px}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:18px 0 10px}
.plate{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:3px 10px;border-radius:999px}
.plate::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.p-red{color:var(--red);background:var(--redbg)} .p-blue{color:var(--blue);background:var(--bluebg)}
.p-yellow{color:var(--yellow);background:var(--yellowbg)} .p-green{color:var(--green);background:var(--greenbg)}
.p-grey{color:var(--grey);background:var(--greybg)}
.daytitle{font-family:var(--display);font-size:26px;line-height:1.2}
.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper button,.btn{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.stepper input[type=date]{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 8px}
.ex{display:grid;gap:6px;border-left:4px solid var(--line)}
.ex.red{border-left-color:var(--red)} .ex.blue{border-left-color:var(--blue)} .ex.yellow{border-left-color:var(--yellow)} .ex.green{border-left-color:var(--green)}
.exhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exname{font-weight:700;font-size:16px}
.rx{font-family:var(--mono);font-weight:600;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--mute)}
.opt{font-size:12px;font-weight:600;color:var(--mute);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
ul.cues{margin:2px 0 0;padding-left:18px;font-size:14px}
ul.cues li{margin:2px 0}
.vids{display:flex;flex-wrap:wrap;gap:6px}
.vid{display:inline-flex;gap:6px;align-items:center;font-size:13px;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:6px;padding:3px 8px}
.vid b{font-family:var(--mono);font-weight:600;color:var(--red)}
.sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets label{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:13px;cursor:pointer;user-select:none}
.sets input{position:absolute;opacity:0;pointer-events:none}
.sets input:checked+span{color:var(--bg)}
.sets label:has(input:checked){background:var(--ink);border-color:var(--ink)}
.sets label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.log{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 8px;width:9.5em}
.progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);width:0}
.cartwrap{display:grid;gap:4px}
.cartsum{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:3;margin-top:12px;box-shadow:0 -4px 16px rgba(0,0,0,.08);display:grid;gap:6px}
.tot{display:grid;gap:3px}
.totl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.food{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px}
.fmain{min-width:0;display:grid;gap:2px}
.fname{font-weight:600;font-size:14px}
.qty{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.qty button{font:inherit;font-size:18px;width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer}
.qty .rx{min-width:1.2em;text-align:center}
.boost{font-size:14px;background:var(--redbg);border-radius:8px;padding:6px 10px}
.boost b{color:var(--red);margin-right:4px}
.note{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:14px}
.note b{font-weight:700}
.warn{border-left:4px solid var(--yellow)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tw{overflow-x:auto}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;font-size:13px;color:var(--mute)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 2px;cursor:pointer;display:grid;gap:2px;justify-items:center;min-width:0}
.cal button .d{font-family:var(--mono);font-size:12px;color:var(--mute)}
.cal button .k{font-weight:700;font-size:13px}
.cal button.cur{outline:2px solid var(--ink)}
.cal button.done .k::after{content:" ✓"}
.cal .red .k{color:var(--red)} .cal .blue .k{color:var(--blue)} .cal .yellow .k{color:var(--yellow)} .cal .grey .k{color:var(--grey)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)} .kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.row label{display:grid;gap:3px;font-size:13px;color:var(--mute)}
.row select,.row input{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 8px;width:7.5em}
.meal{display:grid;gap:4px}
.meal h4{margin:0;font-size:15px}
.meal .kc{font-family:var(--mono);font-size:13px;color:var(--mute)}
.srcgroup summary{cursor:pointer;font-weight:700;padding:6px 0}
.srclist{list-style:none;padding:0;margin:4px 0 12px;display:grid;gap:4px}
.srclist a{color:var(--ink);text-decoration:none;font-size:14px}
.srclist .ch{color:var(--mute);font-size:12px}
.foot{margin-top:28px;font-size:12px;color:var(--mute)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const vidLinks = v => v&&v.length?`<div class="vids">${v.map(([id,t,l])=>`<a class="vid" href="${yt(id,t)}" target="_blank" rel="noopener" title="${esc(VT[id]?VT[id].t:'')}"><b>${t}</b>${esc(l)}</a>`).join('')}</div>`:'';
function nSets(rx){const m=/^(\d+)(?:–\d+)?×/.exec(rx);return m?+m[1]:0}

/* ph: 1 적응(D1–3) · 2 빌드업(D4–7) · 3 풀강도(D8–14, 학기) */
const phaseOf = i => i<3?1:i<7?2:3;
function exCard(key,ctx,ph,col){
  const e=E[key]; const rx=ph===1?e.w1:ph===2?e.w2:(e.w3||e.w2); const n=nSets(rx);
  const id=`${ctx}:${key}`; const done=(S.sets&&S.sets[id])||[]; const lg=(S.log&&S.log[key])||'';
  const boxes=n?`<div class="sets">${Array.from({length:n},(_,i)=>`<label><input type="checkbox" data-set="${id}" data-i="${i}" ${done[i]?'checked':''}><span>${i+1}</span></label>`).join('')}
     <input class="log" id="log-${key}-${ctx}" data-log="${key}" placeholder="무게 · 횟수 메모" value="${esc(lg)}"></div>`:
     `<div class="sets"><label><input type="checkbox" data-set="${id}" data-i="0" ${done[0]?'checked':''}><span>✓</span></label></div>`;
  return `<article class="card ex ${col}">
   <div class="exhead"><div class="exname">${esc(e.n)}</div><div class="rx">${rx}</div></div>
   <div class="meta">${e.r?`<span>휴식 ${e.r}</span>`:''}${e.opt?'<span class="opt">학기 중 시간 없으면 생략</span>':''}</div>
   ${e.c&&e.c.length?`<ul class="cues">${e.c.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`:''}
   ${ph===3&&e.x?`<div class="boost"><b>강도 기법</b> ${esc(e.x)}</div>`:''}
   ${vidLinks(e.v)}${boxes}</article>`;
}
function fixBlock(extra){
  return `<article class="card ex green"><div class="exhead"><div class="exname">교정 루틴 ${extra?'확장판 20분':'10분'}</div><div class="rx">${extra?'20분':'10분'}</div></div>
   <ul class="cues">${FIX.map(f=>`<li><b>${esc(f.n)}</b> <span class="rx" style="font-size:13px">${f.rx}</span></li>`).join('')}
   ${extra?FIX_EXTRA.map(f=>`<li><b>${esc(f.n)}</b> <span class="rx" style="font-size:13px">${f.rx}</span></li>`).join(''):''}</ul>
   <p class="mute" style="font-size:13px">자세한 큐와 영상은 '교정' 탭.</p></article>`;
}

function dayIndex(){
  if(!S.start) return S.cur||0;
  const st=new Date(S.start+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0);

function renderDay(i,ctxPrefix){

  if(S.start){const t=new Date(S.start+'T00:00:00');t.setDate(t.getDate()+i);date=`${t.getMonth()+1}/${t.getDate()} (${WEEK[t.getDay()]})`;}
  const isLift=['FA','BA','FB','BB'].includes(k);
  return `<div class="dayhead"><span class="plate p-${d.col}">${d.name}</span><span class="daytitle">Day ${i+1} · ${esc(d.sub)}</span><span class="mute">${date}</span></div>

function calc(){
  const sex=S.sex||'m', age=+(S.age||24), h=+(S.h||177), w=+(S.w||73);
  const bmr=10*w+6.25*h-5*age+(sex==='m'?5:-161);
  const vac=Math.round(bmr*1.7*0.8/10)*10, sem=Math.round(bmr*1.45*0.85/10)*10;
  const pv=Math.round(w*2.0), ps=Math.round(w*1.8), fat=Math.round(w*0.8);
  const cv=Math.round((vac-pv*4-fat*9)/4), cs=Math.round((sem-ps*4-fat*9)/4);
  return {bmr:Math.round(bmr),vac,sem,pv,ps,fat,cv,cs,w};
}

function sumOf(ids){return ids.reduce((a,id)=>{const f=FD[id];a.kcal+=f.kcal;a.p+=f.p;a.c+=f.c;a.f+=f.f;a.pr+=f.pr;return a},{kcal:0,p:0,c:0,f:0,pr:0})}
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const r1=n=>Math.round(n*10)/10;
function bar(v,t,label,unit){const pct=Math.min(100,Math.round(v/t*100));const over=v>t*1.05;
  return `<div class="tot"><div class="totl"><span>${label}</span><span class="rx">${Math.round(v).toLocaleString('ko-KR')}${unit} <span class="mute">/ ${Math.round(t).toLocaleString('ko-KR')}${unit}</span></span></div>
   <div class="progress"><i style="width:${pct}%;background:${over?'var(--red)':'var(--ink)'}"></i></div></div>`}

  <p class="foot">영양: 식약처 식품영양성분DB(2026-08 기준). 가격: 편의점 행사 정리 사이트(2026-10, GS25는 8월). '추정' 표시는 라벨이 없는 집밥·학식의 대략값.</p>`;
}

function realTab(){

   <div class="card note"><b>오목한 가슴: 뼈 모양은 운동으로 안 바뀐다.</b> 본인이 오목가슴인 트레이너가 2년 동안 딥스·디클라인·크로스오버를 해 봤지만 모양은 그대로였다고 한다. 바뀌는 건 가슴 근육 두께, 등 너비(가슴 옆선), 체지방, 라운드숄더. 함몰이 깊거나 운동할 때 숨참·두근거림이 있으면 흉부외과에서 Haller index를 재 보는 게 맞다. ${vidLinks([['0FFbj_YOTnQ','01:13','2년 해 본 결과'],['0FFbj_YOTnQ','05:14','등 너비로 가로 늘리기']])}</div>
   <div class="card note"><b>축분할 "47명 평균 +1.4 kg"은 대조군 없는 홍보 수치다.</b> 영상마다 기간도 60일·12주로 다르게 말한다. 그래도 구조 자체(부위당 주 2회, 회당 10세트 안팎, 기구 대기 없음)는 주류 근거와 맞아서 골랐다. 방학 6일 버전은 원본에 없어 직접 짰다.</div>

    · 첫날부터 실패 지점: 오래 쉰 뒤 첫 주 고볼륨이 횡문근융해가 생기는 전형적인 상황이라 D1–3만 RIR 2로 둔다<br>
    · 바벨 벤치·RDL 실패: 보조자 없이 바벨 아래 깔리거나 허리가 말리는 게 가장 흔한 헬스장 부상이다. 실패는 머신·케이블·덤벨에서만<br>

    · 휴식 30초 vs 3–4분 → 큰 종목은 2–3분(근거가 긴 쪽)<br>
    · 후방경사 운동이 디스크를 찢는다(정선근) → 본인이 "안 아픈 사람은 해도 된다"고 단서를 달았다. 다음 날 아침 허리가 아프면 멈춘다<br>
    · 햄스트링 스트레칭 → 하지 않고 강화한다</div>
  </div>`;

function srcTab(){
  const G={split:'분할법·복귀',chest:'가슴 두께·오목가슴',belly:'뱃살·리컴프',diet:'식단',apt:'전방경사'};
  const by={}; VIDEOS.forEach(v=>{(by[v.topic]=by[v.topic]||[]).push(v)});
  return `<h2>읽은 영상 ${VIDEOS.length}개</h2>
  <p class="lead">주제별 검색어 25개로 조회수 높은 영상을 골라 자막을 전부 읽었다. 자막 없는 전방경사 영상 1개는 소리를 받아 글로 옮겼다. 영어권 전방경사 영상 4개는 유튜브가 다운로드를 막아 빠졌다.</p>
  ${Object.entries(G).map(([k,l])=>`<details class="srcgroup" ${k==='split'?'open':''}><summary>${l} · ${(by[k]||[]).length}개</summary><ul class="srclist">
   ${(by[k]||[]).sort((a,b)=>(+b.v||0)-(+a.v||0)).map(v=>`<li><a href="${yt(v.id)}" target="_blank" rel="noopener">${esc(v.t)}</a> <span class="ch">${esc(v.ch||'')}${v.v?` · ${(+v.v/1e4).toFixed(0)}만 회`:''}</span></li>`).join('')}</ul></details>`).join('')}
  <p class="foot">체크와 메모는 이 기기 브라우저에만 저장된다.</p>`;
}

/* ---------- 메인 ---------- */
function render(){
  drawTabs();
  const app=document.getElementById('app');
  app.innerHTML={today:todayTab,vac:vTab,sem:semTab,fix:fixTab,diet:dietTab,real:realTab,src:srcTab}[tab]();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;S.tab=tab;save();render();window.scrollTo(0,0);return}
  const d=e.target.closest('[data-day]'); if(d){S.cur=+d.dataset.day;save();render();return}
  const inc=e.target.closest('[data-inc]'); if(inc){S.cart=S.cart||{};S.cart[inc.dataset.inc]=(S.cart[inc.dataset.inc]||0)+1;save();render();return}
  const dec=e.target.closest('[data-dec]'); if(dec){S.cart=S.cart||{};const k=dec.dataset.dec;S.cart[k]=Math.max(0,(S.cart[k]||0)-1);if(!S.cart[k])delete S.cart[k];save();render();return}
  if(e.target.closest('[data-clearcart]')){S.cart={};save();render();return}
  const lp=e.target.closest('[data-loadplan]'); if(lp){const pl=DAYPLANS.find(x=>x.id===lp.dataset.loadplan);S.cart={};pl.meals.flatMap(m=>m[1]).forEach(id=>S.cart[id]=(S.cart[id]||0)+1);S.cartT=pl.target;save();render();
    const el=document.querySelector('.cartwrap'); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const st=e.target.closest('[data-step]'); if(st){
    if(S.start){const x=new Date(S.start+'T00:00:00');x.setDate(x.getDate()-(+st.dataset.step));S.start=x.toISOString().slice(0,10);}
    else{S.cur=Math.max(0,Math.min(13,(S.cur||0)+(+st.dataset.step)));}
    save();render();return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.set){S.sets=S.sets||{};const a=S.sets[el.dataset.set]||[];a[+el.dataset.i]=el.checked;S.sets[el.dataset.set]=a;save();return}
  if(el.dataset.log){S.log=S.log||{};S.log[el.dataset.log]=el.value;save();return}
  if(el.id==='start'){S.start=el.value||null;save();render();return}
  if(['sex','age','h','w','cartT'].includes(el.id)){S[el.id]=el.value;save();render();return}
});
render();
</script>
